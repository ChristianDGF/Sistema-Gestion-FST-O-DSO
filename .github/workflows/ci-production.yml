name: CI — Production

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      checks: write      # requerido por dorny/test-reporter
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Build and Tests (Unit, Contract, Integration & Data)
        run: ./gradlew build generateContractTests test jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Test Results
          path: build/test-results/**/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/reports/jacoco/

      - name: OWASP Dependency-Check (backend SCA)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze --no-daemon
        continue-on-error: true

      - name: Upload Dependency-Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Install Dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Frontend npm audit (SCA)
        working-directory: frontend
        run: npm run audit

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout (full history for blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests + Generate Coverage + Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew generateContractTests test jacocoTestReport sonar --no-daemon

  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [ build-and-test, sonarcloud ]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/christiandgf/sistema-gestion-backend:${{ github.sha }}
            ghcr.io/christiandgf/sistema-gestion-backend:production
            ghcr.io/christiandgf/sistema-gestion-backend:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_KEYCLOAK_URL=https://auth.34-57-191-185.nip.io
            VITE_API_BASE_URL=https://api.34-57-191-185.nip.io/api/v1
          tags: |
            ghcr.io/christiandgf/sistema-gestion-frontend:${{ github.sha }}
            ghcr.io/christiandgf/sistema-gestion-frontend:production
            ghcr.io/christiandgf/sistema-gestion-frontend:latest

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build-push
    environment:
      name: production
      url: http://34.57.191.185:5173
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,docker-compose.production.yml"
          target: "/opt/sistema-gestion"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/sistema-gestion
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.production.yml pull app frontend
            docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --remove-orphans
            docker image prune -f

      - name: Smoke check production
        run: |
          for i in $(seq 1 12); do
            if curl -sf "https://api.34-57-191-185.nip.io/actuator/health" | grep -q '"status":"UP"'; then
              echo "Backend is up after ${i}0s"
              exit 0
            fi
            echo "Waiting for backend to become healthy... (attempt $i/12)"
            sleep 10
          done
          echo "Backend did not become healthy in time"
          exit 1
