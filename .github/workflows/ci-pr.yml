name: CI — Pull Request

on:
  pull_request:
    branches: [ "main", "master", "development", "staging" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      checks: write      # requerido por dorny/test-reporter
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Build and Tests (Unit, Contract, Integration & Data)
        run: ./gradlew build generateContractTests test jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Test Results
          path: build/test-results/**/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/reports/jacoco/

      - name: OWASP Dependency-Check (backend SCA)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze --no-daemon
        continue-on-error: true

      - name: Upload Dependency-Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Install Dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Frontend npm audit (SCA)
        working-directory: frontend
        run: npm run audit

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout (full history for blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests + Generate Coverage + Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew generateContractTests test jacocoTestReport sonar --no-daemon

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Install Dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Write ephemeral .env for Docker Compose (CI-only, never committed)
        run: |
          cat > .env <<EOF
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -hex 16)
          KEYCLOAK_EXTERNAL_CLIENT_SECRET=$(openssl rand -hex 16)
          KEYCLOAK_ADMIN_CLIENT_SECRET=$(openssl rand -hex 16)
          SEED_ADMIN_PASSWORD=admin123
          SEED_EMPLOYEE_PASSWORD=employee123
          GF_SECURITY_ADMIN_PASSWORD=$(openssl rand -hex 16)
          EOF

      - name: Start environment
        run: |
          docker compose up -d db keycloak
          sleep 15
          docker compose up -d app frontend
          sleep 15

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: Run E2E Tests
        working-directory: frontend
        run: npm run test:e2e
        continue-on-error: true

      - name: Publish E2E Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Playwright E2E Results
          path: frontend/playwright-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Tear down Docker Compose
        if: always()
        run: docker compose down

  zap-scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    needs: e2e-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Write ephemeral .env for Docker Compose (CI-only, never committed)
        run: |
          cat > .env <<EOF
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -hex 16)
          KEYCLOAK_EXTERNAL_CLIENT_SECRET=$(openssl rand -hex 16)
          KEYCLOAK_ADMIN_CLIENT_SECRET=$(openssl rand -hex 16)
          SEED_ADMIN_PASSWORD=admin123
          SEED_EMPLOYEE_PASSWORD=employee123
          GF_SECURITY_ADMIN_PASSWORD=$(openssl rand -hex 16)
          EOF

      - name: Start environment
        run: |
          docker compose up -d db keycloak
          sleep 15
          docker compose up -d app frontend
          sleep 15

      - name: OWASP ZAP Baseline Scan (frontend)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        continue-on-error: true
        with:
          target: 'http://localhost:5173'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false
          artifact_name: 'zap-frontend-report'

      - name: OWASP ZAP Baseline Scan (backend Swagger UI)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        continue-on-error: true
        with:
          target: 'http://localhost:8081/swagger-ui.html'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false
          artifact_name: 'zap-backend-report'

      - name: Tear down Docker Compose
        if: always()
        run: docker compose down
