name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "development" ]
  pull_request:
    branches: [ "main", "master", "development" ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # nightly load test, doesn't block PRs

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Build and Tests (Unit, Contract, Integration & Data)
      run: ./gradlew build generateContractTests test jacocoTestReport jacocoTestCoverageVerification --no-daemon

    - name: Upload Test Report
      uses: actions/upload-artifact@v4
      if: always() 
      with:
        name: test-reports
        path: build/reports/tests/

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: build/reports/jacoco/

    - name: OWASP Dependency-Check (backend SCA)
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      run: ./gradlew dependencyCheckAnalyze --no-daemon
      continue-on-error: true

    - name: Upload Dependency-Check Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-check-report
        path: build/reports/dependency-check/

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.20.0'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Frontend Install Dependencies
      working-directory: frontend
      run: npm install

    - name: Frontend npm audit (SCA)
      working-directory: frontend
      run: npm run audit

    - name: Run E2E Tests (Playwright)
      run: |
        docker compose up -d db keycloak
        sleep 15
        docker compose up -d app frontend
        sleep 15
        cd frontend
        npx playwright install --with-deps chromium
        npm run test:e2e
      continue-on-error: true

    - name: OWASP ZAP Baseline Scan (frontend - staging)
      uses: zaproxy/action-baseline@v0.15.0
      continue-on-error: true
      with:
        target: 'http://localhost:5173'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        allow_issue_writing: false
        artifact_name: 'zap-frontend-report'

    - name: OWASP ZAP Baseline Scan (backend Swagger UI - staging)
      uses: zaproxy/action-baseline@v0.15.0
      continue-on-error: true
      with:
        target: 'http://localhost:8081/swagger-ui.html'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        allow_issue_writing: false
        artifact_name: 'zap-backend-report'

    - name: Tear down Docker Compose
      if: always()
      run: docker compose down

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout (full history for blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests + Generate Coverage + Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew generateContractTests test jacocoTestReport sonar --no-daemon
        continue-on-error: true

  performance-tests:
    name: Performance Testing (k6)
    runs-on: ubuntu-latest
    needs: build-and-test
    # Heavy and slow - only runs on demand or nightly, never blocks a PR build.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start staging-like environment
        run: |
          docker compose up -d db keycloak
          sleep 15
          docker compose up -d app frontend
          sleep 15

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 smoke scenario
        uses: grafana/run-k6-action@v1
        with:
          path: performance-tests/scenarios/smoke.js
        env:
          BASE_URL: http://localhost:8081
          KEYCLOAK_URL: http://localhost:8080

      - name: Run k6 load scenario
        uses: grafana/run-k6-action@v1
        with:
          path: performance-tests/scenarios/load.js
        env:
          BASE_URL: http://localhost:8081
          KEYCLOAK_URL: http://localhost:8080

      - name: Upload k6 reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-performance-reports
          path: performance-tests/reports/

      - name: Tear down Docker Compose
        if: always()
        run: docker compose down

