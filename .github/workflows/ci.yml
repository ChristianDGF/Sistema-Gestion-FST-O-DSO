name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Build and Tests (Unit, Contract & Integration)
      run: ./gradlew build generateContractTests test jacocoTestReport jacocoTestCoverageVerification --no-daemon

    - name: Upload Test Report
      uses: actions/upload-artifact@v4
      if: always() 
      with:
        name: test-reports
        path: build/reports/tests/

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: build/reports/jacoco/

    - name: Run E2E Tests (Playwright)
      run: |
        docker compose up -d db keycloak
        sleep 15
        docker compose up -d app frontend
        sleep 15
        cd frontend
        npm ci
        npx playwright install --with-deps chromium
        npm run test:e2e
      continue-on-error: true

    - name: Tear down Docker Compose
      if: always()
      run: docker compose down

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout (full history for blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests + Generate Coverage + Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew generateContractTests test jacocoTestReport sonar --no-daemon
        continue-on-error: true

