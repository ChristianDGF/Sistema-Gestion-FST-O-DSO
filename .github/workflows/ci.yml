name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "development", "staging" ]
  pull_request:
    branches: [ "main", "master", "development", "staging" ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # nightly load test, doesn't block PRs

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Build and Tests (Unit, Contract, Integration & Data)
      run: ./gradlew build generateContractTests test jacocoTestReport jacocoTestCoverageVerification --no-daemon

    - name: Upload Test Report
      uses: actions/upload-artifact@v4
      if: always() 
      with:
        name: test-reports
        path: build/reports/tests/

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: build/reports/jacoco/

    - name: OWASP Dependency-Check (backend SCA)
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      run: ./gradlew dependencyCheckAnalyze --no-daemon
      continue-on-error: true

    - name: Upload Dependency-Check Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-check-report
        path: build/reports/dependency-check/

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.20.0'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Frontend Install Dependencies
      working-directory: frontend
      run: npm install

    - name: Frontend npm audit (SCA)
      working-directory: frontend
      run: npm run audit

    - name: Write ephemeral .env for Docker Compose (CI-only, never committed)
      run: |
        cat > .env <<EOF
        POSTGRES_PASSWORD=$(openssl rand -hex 16)
        KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -hex 16)
        KEYCLOAK_EXTERNAL_CLIENT_SECRET=$(openssl rand -hex 16)
        KEYCLOAK_ADMIN_CLIENT_SECRET=$(openssl rand -hex 16)
        SEED_ADMIN_PASSWORD=admin123
        SEED_EMPLOYEE_PASSWORD=employee123
        GF_SECURITY_ADMIN_PASSWORD=$(openssl rand -hex 16)
        EOF

    - name: Run E2E Tests (Playwright)
      run: |
        docker compose up -d db keycloak
        sleep 15
        docker compose up -d app frontend
        sleep 15
        cd frontend
        npx playwright install --with-deps chromium
        npm run test:e2e
      continue-on-error: true

    - name: OWASP ZAP Baseline Scan (frontend - staging)
      uses: zaproxy/action-baseline@v0.15.0
      continue-on-error: true
      with:
        target: 'http://localhost:5173'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        allow_issue_writing: false
        artifact_name: 'zap-frontend-report'

    - name: OWASP ZAP Baseline Scan (backend Swagger UI - staging)
      uses: zaproxy/action-baseline@v0.15.0
      continue-on-error: true
      with:
        target: 'http://localhost:8081/swagger-ui.html'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        allow_issue_writing: false
        artifact_name: 'zap-backend-report'

    - name: Tear down Docker Compose
      if: always()
      run: docker compose down

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    # El plan gratuito de SonarCloud solo soporta análisis de PRs y de la rama principal.
    # Saltar en pushes directos a staging/development evita el error "Not authorized".
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout (full history for blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests + Generate Coverage + Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew generateContractTests test jacocoTestReport sonar --no-daemon

  docker-build-push-staging:
    name: Build & Push Docker Images (Staging)
    runs-on: ubuntu-latest
    needs: [build-and-test, sonarcloud]
    # sonarcloud se salta en pushes a staging (plan free) - needs.*.result == 'skipped' no basta para
    # desactivar el skip-cascade por defecto de GitHub Actions; hace falta !failure() && !cancelled().
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging' && !failure() && !cancelled()
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/christiandgf/sistema-gestion-backend:${{ github.sha }}
            ghcr.io/christiandgf/sistema-gestion-backend:staging

      - name: Build & push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_KEYCLOAK_URL=https://auth.34-136-168-229.nip.io
            VITE_API_BASE_URL=https://api.34-136-168-229.nip.io/api/v1
          tags: |
            ghcr.io/christiandgf/sistema-gestion-frontend:${{ github.sha }}
            ghcr.io/christiandgf/sistema-gestion-frontend:staging

  docker-build-push-production:
    name: Build & Push Docker Images (Production)
    runs-on: ubuntu-latest
    needs: [build-and-test, sonarcloud]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-and-test.result == 'success' && needs.sonarcloud.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/christiandgf/sistema-gestion-backend:${{ github.sha }}
            ghcr.io/christiandgf/sistema-gestion-backend:production
            ghcr.io/christiandgf/sistema-gestion-backend:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_KEYCLOAK_URL=https://auth.34-57-191-185.nip.io
            VITE_API_BASE_URL=https://api.34-57-191-185.nip.io/api/v1
          tags: |
            ghcr.io/christiandgf/sistema-gestion-frontend:${{ github.sha }}
            ghcr.io/christiandgf/sistema-gestion-frontend:production
            ghcr.io/christiandgf/sistema-gestion-frontend:latest

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build-push-staging
    # success() implícito mira toda la cadena transitiva (incluye sonarcloud, que va 'skipped'
    # en pushes a staging) - hace falta !failure() && !cancelled() otra vez, mismo motivo que arriba.
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging' && !failure() && !cancelled()
    environment:
      name: staging
      url: http://34.136.168.229:5173
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/sistema-gestion
            git fetch origin staging
            git checkout staging
            git reset --hard origin/staging
            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull app frontend
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --remove-orphans
            docker image prune -f

      - name: Smoke check staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          for i in $(seq 1 12); do
            if curl -sf "http://$STAGING_HOST:8081/actuator/health" | grep -q '"status":"UP"'; then
              echo "Backend is up after ${i}0s"
              exit 0
            fi
            echo "Waiting for backend to become healthy... (attempt $i/12)"
            sleep 10
          done
          echo "Backend did not become healthy in time"
          exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build-push-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !failure() && !cancelled()
    environment:
      name: production
      url: http://34.57.191.185:5173
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/sistema-gestion
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            docker compose -f docker-compose.yml -f docker-compose.production.yml pull app frontend
            docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --remove-orphans
            docker image prune -f

      - name: Smoke check production
        env:
          PROD_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          for i in $(seq 1 12); do
            if curl -sf "http://$PROD_HOST:8081/actuator/health" | grep -q '"status":"UP"'; then
              echo "Backend is up after ${i}0s"
              exit 0
            fi
            echo "Waiting for backend to become healthy... (attempt $i/12)"
            sleep 10
          done
          echo "Backend did not become healthy in time"
          exit 1

  performance-tests:
    name: Performance Testing (k6)
    runs-on: ubuntu-latest
    needs: build-and-test
    # Heavy and slow - only runs on demand or nightly, never blocks a PR build.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Write ephemeral .env for Docker Compose (CI-only, never committed)
        run: |
          cat > .env <<EOF
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -hex 16)
          KEYCLOAK_EXTERNAL_CLIENT_SECRET=$(openssl rand -hex 16)
          KEYCLOAK_ADMIN_CLIENT_SECRET=$(openssl rand -hex 16)
          SEED_ADMIN_PASSWORD=admin123
          SEED_EMPLOYEE_PASSWORD=employee123
          GF_SECURITY_ADMIN_PASSWORD=$(openssl rand -hex 16)
          EOF

      - name: Start staging-like environment
        run: |
          docker compose up -d db keycloak
          sleep 15
          docker compose up -d app frontend
          sleep 15

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 smoke scenario
        uses: grafana/run-k6-action@v1
        with:
          path: performance-tests/scenarios/smoke.js
        env:
          BASE_URL: http://localhost:8081
          KEYCLOAK_URL: http://localhost:8080

      - name: Run k6 load scenario
        uses: grafana/run-k6-action@v1
        with:
          path: performance-tests/scenarios/load.js
        env:
          BASE_URL: http://localhost:8081
          KEYCLOAK_URL: http://localhost:8080

      - name: Upload k6 reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-performance-reports
          path: performance-tests/reports/

      - name: Tear down Docker Compose
        if: always()
        run: docker compose down

