name: CI — Staging

on:
  push:
    branches: [ "staging" ]

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    permissions:
      checks: write      # requerido por dorny/test-reporter
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Build and Tests (Unit, Contract, Integration & Data)
        run: ./gradlew build generateContractTests test jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: Publish Test Results
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        if: always()
        with:
          name: JUnit Test Results
          path: build/test-results/**/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload Coverage Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: build/reports/jacoco/

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.20.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Install Dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Frontend npm audit (SCA)
        working-directory: frontend
        run: npm run audit

  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/christiandgf/sistema-gestion-backend:${{ github.sha }}
            ghcr.io/christiandgf/sistema-gestion-backend:staging

      - name: Build & push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_KEYCLOAK_URL=https://auth.${{ vars.STAGING_DOMAIN }}
            VITE_API_BASE_URL=https://api.${{ vars.STAGING_DOMAIN }}/api/v1
          tags: |
            ghcr.io/christiandgf/sistema-gestion-frontend:${{ github.sha }}
            ghcr.io/christiandgf/sistema-gestion-frontend:staging

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build-push
    environment:
      name: staging
      url: http://${{ vars.STAGING_IP }}:5173
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Copy compose files to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,docker-compose.staging.yml"
          target: "/opt/sistema-gestion"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/sistema-gestion
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull app frontend
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --remove-orphans
            docker image prune -f

      - name: Smoke check staging
        run: |
          for i in $(seq 1 12); do
            if curl -sf "https://api.${{ vars.STAGING_DOMAIN }}/actuator/health" | grep -q '"status":"UP"'; then
              echo "Backend is up after ${i}0s"
              exit 0
            fi
            echo "Waiting for backend to become healthy... (attempt $i/12)"
            sleep 10
          done
          echo "Backend did not become healthy in time"
          exit 1
