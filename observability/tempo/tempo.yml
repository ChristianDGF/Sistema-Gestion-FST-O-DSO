server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

# metrics_generator: convierte trazas en métricas (spanmetrics + service-graphs)
# En Tempo 2.7.x, processors y remote_write van dentro de metrics_generator.processor
# y metrics_generator.storage respectivamente — NO como campos directos del bloque.
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: local
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    span_metrics:
      # Dimensiones adicionales para los histogramas de latencia
      dimensions:
        - http.method
        - http.route
        - http.status_code
    service_graphs:
      dimensions:
        - http.method

# overrides: activa los processors para todos los tenants
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
