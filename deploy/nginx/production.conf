# Reverse proxy de la VM de Production (sistema-gestion-prod, 34.57.191.185).
# Instalado en /etc/nginx/sites-available/sistema-gestion en esa VM (fuera de Docker Compose).
# Ver deploy/nginx/staging.conf para la explicación del procedimiento (idéntico, solo
# cambian el IP/hostnames).

server {
    listen 80;
    server_name production.34-57-191-185.nip.io;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

