# Reverse proxy de la VM de Staging (sistema-gestion-staging, 34.136.168.229).
# Instalado en /etc/nginx/sites-available/sistema-gestion en esa VM (fuera de Docker Compose).
# Los bloques `server` abajo son solo HTTP - correr `certbot --nginx` con los 3 hostnames
# los actualiza automáticamente a HTTPS (agrega `listen 443 ssl`, certificados, y el
# redirect 80->443). Ver cicd_implementation_plan.md para el procedimiento completo.

server {
    listen 80;
    server_name staging.34-136-168-229.nip.io;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.34-136-168-229.nip.io;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name auth.34-136-168-229.nip.io;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
